name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: RISCfuture/XCUITestKit/.github/workflows/ios-ci.yml@main
    with:
      scheme: "CTA Helper"
      unit-test-plan: "Unit Tests"
      ui-test-plan: "UI Tests"
      build-matrix: |
        {"include":[
          {
            "ios-label": "latest",
            "runner": "macos-26",
            "device": "iPhone 17 Pro",
            "device-type": "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro",
            "os-version": "",
            "xcode-version": "latest-stable"
          }
        ]}
      ui-matrix: |
        {"include":[
          {
            "ios-label": "latest",
            "runner": "macos-26",
            "device": "iPhone 17 Pro",
            "device-type": "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro",
            "os-version": "",
            "xcode-version": "latest-stable"
          },
          {
            "ios-label": "latest",
            "runner": "macos-26",
            "device": "iPad Pro 13-inch (M5)",
            "device-type": "com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M5-12GB",
            "os-version": "",
            "xcode-version": "latest-stable"
          }
        ]}

  docs:
    name: Build Documentation
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Set up iOS simulator
        id: sim
        uses: RISCfuture/XCUITestKit/ci-templates/setup-ios-simulator@main
        with:
          device: "iPhone 17 Pro"
          device-type: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
          xcode-version: latest-stable
      - name: Enable macros
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Record toolchain version
        id: toolchain
        run: echo "xcode=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-
      - name: Cache Xcode build products
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/DocumentationDerivedData
          key: derived-docs-macos-26-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('**/Package.resolved') }}
      # The app target sets OTHER_DOCC_FLAGS to --warnings-as-errors, so any DocC warning in the
      # app's own doc comments fails this job. The flag belongs to the target rather than to this
      # command because a command-line override reaches the package dependencies too, and their
      # catalogs are not ours to fix.
      - name: Build documentation
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild docbuild \
            -scheme "CTA Helper" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -destination-timeout 300 \
            -derivedDataPath "$RUNNER_TEMP/DocumentationDerivedData" \
            | xcbeautify --renderer github-actions
